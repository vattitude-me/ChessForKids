  <!-- shield -->
  <path d="M256 20 L466 84 V246 C466 372 378 456 256 496 C134 456 46 372 46 246 V84 Z" fill="url(#gd)"/>
  <path d="M256 44 L444 101 V246 C444 358 366 434 256 471 C146 434 68 358 68 246 V101 Z" fill="url(#sh)"/>
