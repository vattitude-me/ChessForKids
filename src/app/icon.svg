    <rect x="160" y="184" width="64" height="64"/><rect x="288" y="184" width="64" height="64"/>
    <rect x="96" y="248" width="64" height="64"/><rect x="352" y="248" width="64" height="64"/>
  </g>
  <!-- knight -->
  <g fill="url(#gd)">
    <path d="M178 372 C 172 330, 190 300, 212 280 L 158 292 C 136 296, 118 284, 118 264 C 118 248, 128 238, 142 230 L 194 194 C 198 166, 214 140, 238 122 L 240 84 L 266 108 C 324 114, 356 160, 358 220 C 360 276, 336 322, 342 372 Z"/>
